name: CI & Branch Check

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # 1단계: main으로 가는 PR일 경우 출발 브랜치가 develop인지 검사
  check-source-branch:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch is develop
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "❌ 오류: main 브랜치로는 오직 'develop' 브랜치에서만 PR을 병합할 수 있습니다."
            echo "현재 시도한 브랜치: ${{ github.head_ref }}"
            exit 1
          fi
          echo "✅ 통과: develop 브랜치에서 생성된 PR입니다."

  # 2단계: 코드 품질(Lint), 테스트, 빌드 검사 (main, develop PR 모두 실행)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test --if-present

      - name: Build Project
        run: npm run build
